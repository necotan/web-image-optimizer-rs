[package]
name = "wio-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "wio-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui_extras = { version = "0.37.0", default-features = false }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
wio-core = { version = "0.1.0", path = "../core" }
